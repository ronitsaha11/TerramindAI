[project]
name = "terramind-api"
version = "0.1.0"
description = "FastAPI backend for TerraMind AI"
readme = "README.md"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["alembic"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"] # pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
# "live" tests call the real Claude API: they need credentials, cost money,
# and are nondeterministic, so they are deselected by default and never run
# in CI. Run them deliberately with: pytest -m live
addopts = "-ra -q -m 'not live'"
markers = [
    "live: calls the real Claude API; requires ANTHROPIC_API_KEY",
]
testpaths = [
    "tests",
]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
